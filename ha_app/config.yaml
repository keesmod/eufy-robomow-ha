name: Eufy Mower Bridge
version: 0.10.0
slug: eufy_mower_bridge
description: Dedicated Eufy E15 mower bridge for the Eufy Robomow integration (state routes, opt-in start/pause/resume/stop, opt-in settings, read-only map route, local install candidate)
url: https://github.com/keesmod/eufy-robomow-ha
arch:
  - amd64
  - aarch64
startup: application
boot: manual
init: false
timeout: 25
map:
  # The app's own configuration folder, read-only, for the operator's private map provisioning file.
  - type: addon_config
    path: /config
ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: Private bridge API, bearer token required
options:
  token: ""
  email: ""
  password: ""
  country: ""
schema:
  token: password
  email: email
  password: password
  country: str
  operating_mode: list(observe_only|control)?
  settings_mode: list(read_only|write)?
  cloud_timeout_ms: int(1000,60000)?
  local_timeout_ms: int(1000,60000)?
  host: str?
  hosts: str?
  control_stop_route: str?
  control_max_state_age_ms: int(1000,300000)?
  control_read_back_ms: int(1000,60000)?
  map_provisioning_file: str?
  map_mower_id: str?
