name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Types
        run: python -m mypy --follow-imports=silent --ignore-missing-imports --check-untyped-defs custom_components/eufy_robomow
      - name: Tests
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: node --experimental-default-type=module --test tests/frontend/card.test.mjs

  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - name: Install pinned bridge dependencies
        run: npm ci --ignore-scripts
        working-directory: bridge
      - name: Types
        run: npm run typecheck
        working-directory: bridge
      - name: Build
        run: npm run build
        working-directory: bridge
      - name: Tests
        run: npm test
        working-directory: bridge
      - name: Built entrypoint refuses an invalid configuration without starting
        working-directory: bridge
        run: |
          status=0
          node dist/main.js || status=$?
          test "$status" -eq 78

  bridge-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Audit all locked bridge dependencies without installing packages
        run: npm audit --package-lock-only --ignore-scripts --include=dev --include=optional --include=peer
        working-directory: bridge

  bridge-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Staged app sources and versions match the bridge
        run: |
          python3 scripts/prepare_ha_app.py
          git diff --exit-code -- ha_app
      - name: Build the standalone image from the pinned base and lockfile
        run: docker build -t eufy-mower-bridge:test ./bridge
      - name: Standalone image refuses without configuration, runs healthy without network and stops cleanly
        run: bridge/scripts/container-smoke.sh eufy-mower-bridge:test
      - name: Build the Home Assistant app candidate
        run: docker build -t eufy-mower-bridge-app:test ./ha_app
      - name: App candidate refuses without options, runs healthy without network and stops cleanly
        run: bridge/scripts/container-smoke.sh --app eufy-mower-bridge-app:test
      - name: App cloud-map option reaches the running bridge without enabling writes
        run: bridge/scripts/container-smoke.sh --app --cloud-maps eufy-mower-bridge-app:test

  hassfest:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/home-assistant/hassfest@sha256:5fc3c5d7df109d248a61acfb0a675b38b1e4dc3a202feb260a8e33696f9803e3
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate integration
        run: |
          cd /usr/src/homeassistant
          python3 -m script.hassfest --action validate --integration-path "$GITHUB_WORKSPACE/custom_components/eufy_robomow"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install 'pip-audit>=2.9,<3'
      - name: Audit declared runtime dependencies
        run: |
          python -c 'import json; print("\n".join(json.load(open("custom_components/eufy_robomow/manifest.json"))["requirements"]))' > /tmp/runtime-requirements.txt
          python -m pip_audit --requirement /tmp/runtime-requirements.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Scan source for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL "$base/$asset" -o "/tmp/$asset"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/checksums.txt
          (cd /tmp && grep "  $asset\$" checksums.txt | sha256sum --check --strict)
          tar -xzf "/tmp/$asset" -C /tmp gitleaks
          /tmp/gitleaks dir --redact --no-banner .
